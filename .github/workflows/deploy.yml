name: CD - Deploy no GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Montar pasta de publicação
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -r images _site/

      - name: Listar arquivos publicados
        run: ls -R _site

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

  notificar-falha:
    name: Notificar falha no Discord
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensagem
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ Deploy FALHOU em $REPO. Detalhes: $RUN_URL\"}" \
            "$WEBHOOK"